[package]
name = "lotrc"
version = "0.1.0"
edition = "2024"

[features]
default = []
ffi = []

[dependencies]
lotrc_proc = { path = "../lotrc_proc" }
lotrc_wrappers = { path = "../lotrc_wrappers" }
zerocopy = { workspace = true, features = ["derive", "alloc"] }
anyhow = { workspace = true }
log = { workspace = true }
indexmap = { workspace = true, features = ["serde", "rayon"] }
itertools = "0.13.0"
flate2 = { version = "1.0.35", features = ["zlib-ng"], default-features = false }
rayon = "1.10.0"
parking_lot = "0.12.3"
lazy_static = "1.5.0"
bcndecode = "0.2.0"
enum_dispatch = "0.3.13"
