[package]
name = "lotrc_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
lotrc = { workspace = true, features = ["ffi"] }
log = { workspace = true }
clap = { version = "4.5.35", features = ["derive"] }
pretty_env_logger = "0.5.0"
indicatif = "0.18.6"
indicatif-log-bridge = "0.2.2"
indexmap = { workspace = true, features = ["serde", "rayon"] }
tracing-subscriber = "0.3.23"
